steps:
  # Build the Docker image with correct context
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sciinovcrms:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sciinovcrms:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'server'

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sciinovcrms:latest'

images:
  - 'gcr.io/$PROJECT_ID/sciinovcrms:latest'

